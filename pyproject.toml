[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sprig-lang-tutorial"
version = "0.1.0"
description = "A small educational tree-walking programming language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sprig = "sprig.cli:main"

[tool.setuptools.packages.find]
include = ["sprig*"]

